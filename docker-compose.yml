services:
  api-flow-tester:
    build: .
    ports:
      - "9011:9011"
      - "8099:8099"
    volumes:
      - ./webapp:/app/webapp
      - ./tools:/app/tools
      - ./bin:/app/bin
      - ./examples:/app/examples
    environment:
      PYTHONPATH: /app
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:9011/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
